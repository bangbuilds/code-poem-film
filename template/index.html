<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>poem film</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #eee4ce;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1920" data-height="1080">
      <!-- the whole film is painted on this one canvas, frame by frame, from the timeline's time -->
      <canvas id="stage" class="clip" width="1920" height="1080" data-start="0" data-duration="20" data-track-index="0" data-layout-allow-overflow></canvas>
      <!-- score, effects and the recitation, mixed by film/score.py -->
      <audio id="score" src="assets/score.wav" data-start="0" data-duration="20" data-track-index="1" data-volume="1"></audio>
    </div>
    <!-- generated by tools/film.py: stroke data, the poem, how long each recited piece is -->
    <script src="assets/glyphs.js"></script>
    <script src="assets/poem.js"></script>
    <script src="assets/voice.js"></script>
    <!-- when things happen -->
    <script src="engine/timing.js"></script>
    <script src="film/timing.js"></script>
    <!-- the engine, then this film's scenes -->
    <script src="engine/lib.js"></script>
    <script src="engine/scenery.js"></script>
    <script src="engine/actors.js"></script>
    <script src="engine/stage.js"></script>
    <script src="film/scenes.js"></script>
    <script>
      FILM.init(document.getElementById("stage"));
      const clock = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(clock, { t: TIMING.total, duration: TIMING.total, ease: "none", onUpdate: () => FILM.draw(clock.t) }, 0);
      FILM.draw(0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
